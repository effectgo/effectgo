# Declines install scripts for esbuild and sharp (they ship prebuilds),
# clearing pnpm's build-scripts gate. Adding a package here lets it run scripts.
packages: []
supportedArchitectures:
  cpu:
    - current
    - wasm32
allowBuilds: # pnpm 11
  esbuild: false
  sharp: false
ignoredBuiltDependencies: # pnpm 10
  - esbuild
  - sharp
minimumReleaseAgeExclude:
    - '@cloudflare/nimbus-docs@0.17.0'
# Hoist satteri's platform bindings to node_modules/ so the prerender bundle,
# which inlines satteri and resolves its native binding from dist/.prerender/,
# can find them under pnpm's strict layout ("Cannot find native binding").
publicHoistPattern:
  - '@bruits/*'
