# Builds a golangci-lint binary that contains the effectgo plugin:
#
#   golangci-lint custom        (writes ./bin/custom-gcl; see docs/guide/editor.md)
#
# The plugin is taken from the effectgo checkout two levels up. Outside this
# repository, replace `path` with `version: v0.3.0` to fetch the public module
# through the Go proxy.
version: v2.14.0
name: custom-gcl
destination: ../../bin
plugins:
  - module: github.com/effectgo/effectgo
    import: github.com/effectgo/effectgo/plugin
    path: ../..
